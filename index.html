<!doctype html>
<html lang="ko" data-theme="lavender">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFE7FF">
<title>똑똑똑미술학원 — 방명록</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23FFD9E8'/%3E%3Ccircle cx='24' cy='28' r='5' fill='%23332A44'/%3E%3Ccircle cx='40' cy='28' r='5' fill='%23332A44'/%3E%3Cpath d='M22 40c4 6 16 6 20 0' stroke='%23332A44' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/display.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="orb orb-4"></span>
    <span class="grain"></span>
    <div class="xmas-scene" id="xmasScene" aria-hidden="true">
      <div class="snow-layer"></div>
      <div class="xmas-tree-wrap">
        <svg class="xmas-tree-svg" viewBox="0 0 800 920" preserveAspectRatio="xMidYMax meet">
          <defs>
            <radialGradient id="starHalo" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FFF7B2" stop-opacity="0.95"/>
              <stop offset="45%" stop-color="#FFD43B" stop-opacity="0.45"/>
              <stop offset="100%" stop-color="#FFD43B" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="treeTier1" x1="0" y1="0" x2="0.2" y2="1">
              <stop offset="0%" stop-color="#2B8A57"/>
              <stop offset="100%" stop-color="#175636"/>
            </linearGradient>
            <linearGradient id="treeTier2" x1="0" y1="0" x2="0.2" y2="1">
              <stop offset="0%" stop-color="#237A4B"/>
              <stop offset="100%" stop-color="#12472C"/>
            </linearGradient>
            <linearGradient id="treeTier3" x1="0" y1="0" x2="0.2" y2="1">
              <stop offset="0%" stop-color="#1D6A40"/>
              <stop offset="100%" stop-color="#0E3822"/>
            </linearGradient>
            <linearGradient id="treeTier4" x1="0" y1="0" x2="0.2" y2="1">
              <stop offset="0%" stop-color="#185B36"/>
              <stop offset="100%" stop-color="#0A2B1A"/>
            </linearGradient>
            <linearGradient id="trunkGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#6B4226"/>
              <stop offset="50%" stop-color="#855433"/>
              <stop offset="100%" stop-color="#4E2E18"/>
            </linearGradient>
            <linearGradient id="goldStar" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#FFF9C4"/>
              <stop offset="45%" stop-color="#FFD43B"/>
              <stop offset="100%" stop-color="#F59F00"/>
            </linearGradient>
          </defs>

          <!-- 바닥 눈언덕 -->
          <ellipse cx="400" cy="885" rx="340" ry="32" fill="rgba(255,255,255,0.16)"/>
          <ellipse cx="400" cy="880" rx="240" ry="22" fill="rgba(255,255,255,0.22)"/>

          <!-- 나무 기둥 및 받침 -->
          <rect x="352" y="750" width="96" height="125" rx="18" fill="url(#trunkGrad)"/>
          <path d="M324 855 H476 L462 895 H338 Z" fill="#A62639" opacity="0.9"/>
          <rect x="318" y="846" width="164" height="16" rx="8" fill="#FFD43B"/>

          <!-- 4단(맨 아래) 솔잎 -->
          <path d="M400 450 L95 785 Q245 825 400 795 Q555 825 705 785 Z" fill="url(#treeTier4)"/>
          <!-- 3단 솔잎 -->
          <path d="M400 315 L145 630 Q272 668 400 640 Q528 668 655 630 Z" fill="url(#treeTier3)"/>
          <!-- 2단 솔잎 -->
          <path d="M400 200 L200 475 Q300 508 400 482 Q500 508 600 475 Z" fill="url(#treeTier2)"/>
          <!-- 1단(맨 위) 솔잎 -->
          <path d="M400 102 L255 330 Q328 356 400 335 Q472 356 545 330 Z" fill="url(#treeTier1)"/>

          <!-- 눈 덮인 가지 하이라이트 -->
          <path d="M262 328 Q330 350 400 332 Q470 350 538 328" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="7" stroke-linecap="round"/>
          <path d="M208 472 Q304 500 400 478 Q496 500 592 472" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="8" stroke-linecap="round"/>
          <path d="M154 626 Q276 660 400 634 Q524 660 646 626" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="9" stroke-linecap="round"/>
          <path d="M106 780 Q252 816 400 788 Q548 816 694 780" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="10" stroke-linecap="round"/>

          <!-- 황금 가랜드 줄 -->
          <path d="M295 270 Q400 335 515 285" fill="none" stroke="#FFD43B" stroke-width="3.5" stroke-dasharray="7 7" opacity="0.72"/>
          <path d="M235 415 Q400 505 565 435" fill="none" stroke="#FFD43B" stroke-width="4" stroke-dasharray="8 8" opacity="0.72"/>
          <path d="M180 565 Q400 675 625 585" fill="none" stroke="#FFD43B" stroke-width="4.5" stroke-dasharray="8 8" opacity="0.72"/>
          <path d="M130 720 Q400 835 670 735" fill="none" stroke="#FFD43B" stroke-width="5" stroke-dasharray="9 9" opacity="0.72"/>

          <!-- 반짝이는 꼬마전구 -->
          <g class="xmas-lights">
            <circle class="bulb b1" cx="350" cy="235" r="7" fill="#FFE066"/>
            <circle class="bulb b2" cx="445" cy="255" r="7" fill="#FF6B6B"/>
            <circle class="bulb b3" cx="310" cy="375" r="8" fill="#74C0FC"/>
            <circle class="bulb b1" cx="415" cy="400" r="8" fill="#FFE066"/>
            <circle class="bulb b2" cx="505" cy="385" r="8" fill="#FF8787"/>
            <circle class="bulb b3" cx="250" cy="525" r="8.5" fill="#FFE066"/>
            <circle class="bulb b1" cx="365" cy="555" r="8.5" fill="#63E6BE"/>
            <circle class="bulb b2" cx="470" cy="540" r="8.5" fill="#FF6B6B"/>
            <circle class="bulb b3" cx="565" cy="565" r="8.5" fill="#FFE066"/>
            <circle class="bulb b1" cx="195" cy="695" r="9" fill="#FF8787"/>
            <circle class="bulb b2" cx="315" cy="725" r="9" fill="#FFE066"/>
            <circle class="bulb b3" cx="430" cy="710" r="9" fill="#74C0FC"/>
            <circle class="bulb b1" cx="545" cy="735" r="9" fill="#63E6BE"/>
            <circle class="bulb b2" cx="630" cy="705" r="9" fill="#FFE066"/>
          </g>

          <!-- 꼭대기 베들레헴 황금 별 -->
          <circle cx="400" cy="86" r="74" fill="url(#starHalo)" class="star-halo"/>
          <polygon class="tree-star" points="400,24 417,64 460,68 427,96 437,138 400,115 363,138 373,96 340,68 383,64" fill="url(#goldStar)" stroke="#FFF9DB" stroke-width="3" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <!-- 별빛 크리스마스 트리 (퍼플 스파클 나선 트리 + Merry Christmas) -->
    <div class="starlight-scene" id="starlightScene" aria-hidden="true">
      <div class="snow-layer"></div>
      <div class="starlight-tree-wrap">
        <canvas id="starlightCanvas" width="900" height="1020"></canvas>
      </div>
    </div>
  </div>

  <div class="brand-badge" id="brandBadge">
    <img class="brand-logo" src="logo.png" alt="똑똑똑미술학원">
  </div>

  <header class="topbar" id="topbar">
    <h1 class="title" id="title">방명록</h1>
    <p class="subtitle" id="subtitle">What's on your mind? Fill your bubble!</p>
  </header>

  <main class="stage" id="stage" aria-live="polite"></main>

  <div class="spotlight" id="spotlight" aria-hidden="true"></div>

  <aside class="qr-panel" id="qrPanel">
    <div class="qr-card">
      <canvas id="qrCanvas" width="560" height="560" aria-label="모바일 그리기 페이지 QR 코드"></canvas>
      <span class="qr-glint" aria-hidden="true"></span>
    </div>
    <div class="qr-copy">
      <strong>휴대폰 카메라로 스캔</strong>
      <span>Scan &amp; draw your bubble</span>
      <em id="drawUrl">draw.html?room=…</em>
      <span class="qr-room">방 코드 <b id="roomCode">────────</b></span>
    </div>
  </aside>

  <div class="badge" id="countBadge"><span id="countNum">0</span> bubbles</div>
  <div class="hint" id="hint"><b>T</b> 테마 · <b>H</b> 화면 숨기기 · <b>Q</b> QR 숨기기</div>

  <!-- 터치 전용 버튼 (태블릿·스마트폰에서 단축키 대신 사용) -->
  <div class="touchbar" id="touchbar" role="toolbar" aria-label="화면 조작">
    <button class="tb" data-act="theme" title="테마 바꾸기" aria-label="테마 바꾸기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 2.2 2.2 0 0 0 2.2-2.2c0-.6-.2-1.1-.6-1.5-.4-.4-.6-.9-.6-1.4A2.4 2.4 0 0 1 15.4 13H17a4 4 0 0 0 4-4c0-3.3-4-6-9-6Z"/><circle cx="7.6" cy="10.2" r="1.15"/><circle cx="11" cy="7" r="1.15"/><circle cx="15.2" cy="8" r="1.15"/></svg>
    </button>
    <button class="tb" data-act="qr" title="QR 코드 켜기/끄기" aria-label="QR 코드 켜기/끄기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.4" y="3.4" width="7" height="7" rx="1.6"/><rect x="13.6" y="3.4" width="7" height="7" rx="1.6"/><rect x="3.4" y="13.6" width="7" height="7" rx="1.6"/><path d="M14 14h2.6v2.6H14zM18.4 14H21v1.4M14 18.4h1.4M17.6 18.4H21v2.6h-3.4z"/></svg>
    </button>
    <button class="tb" data-act="newroom" title="새 방 만들기" aria-label="새 방 만들기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tb" data-act="reset" title="방명록 비우기" aria-label="방명록 비우기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9.5 7V4.8h5V7M6.5 7l.9 12.2h9.2L17.5 7"/><path d="M10.4 10.6v5.4M13.6 10.6v5.4"/></svg>
    </button>
    <button class="tb" data-act="hide" title="화면 깔끔하게" aria-label="화면 깔끔하게">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.6 12S6 6.4 12 6.4 21.4 12 21.4 12 18 17.6 12 17.6 2.6 12 2.6 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>
    </button>
    <button class="tb" data-act="fullscreen" title="전체화면 전환 (F)" aria-label="전체화면 전환">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button class="tb" data-act="settings" title="환경설정 (문자 크기·위치·QR 위치)" aria-label="환경설정">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
    </button>
    <button class="tb fold" data-act="fold" title="버튼 접기" aria-label="버튼 접기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
  <button class="touch-show" id="touchShow" title="버튼 펼치기" aria-label="버튼 펼치기">⋯</button>

  <!-- 빠른 환경설정 패널 (미디어월 화면에서 바로 조작) -->
  <aside class="quick-settings hidden" id="quickSettings" aria-label="환경설정">
    <div class="qs-head">
      <strong>⚙️ 환경설정</strong>
      <button class="qs-close" id="qsClose" type="button" aria-label="닫기">✕</button>
    </div>
    <label class="qs-row">
      <span>테마</span>
      <select id="qsTheme">
        <option value="lavender">라벤더 (기본)</option>
        <option value="cream">크림 화이트</option>
        <option value="night">나이트 다크</option>
        <option value="christmas">🎄 크리스마스 트리 (그린)</option>
        <option value="starlight">✨ 별빛 크리스마스 트리 (퍼플)</option>
      </select>
    </label>
    <label class="qs-row">
      <span>문자 크기 <b id="qsFontVal">100%</b></span>
      <input type="range" id="qsFontScale" min="70" max="160" step="5" value="100">
    </label>
    <label class="qs-row">
      <span>문자 위치</span>
      <select id="qsTitlePos">
        <option value="top-center">상단 가운데 (기본)</option>
        <option value="top-left">왼쪽 위</option>
        <option value="top-right">오른쪽 위</option>
        <option value="bottom-center">하단 가운데</option>
        <option value="bottom-left">왼쪽 아래</option>
        <option value="bottom-right">오른쪽 아래</option>
        <option value="center">화면 정중앙</option>
      </select>
    </label>
    <label class="qs-row">
      <span>QR 위치</span>
      <select id="qsQrPos">
        <option value="bottom">하단 가운데</option>
        <option value="corner">오른쪽 아래</option>
        <option value="bottom-left">왼쪽 아래</option>
        <option value="top-right">오른쪽 위</option>
        <option value="top-left">왼쪽 위</option>
      </select>
    </label>
    <label class="qs-row switch">
      <span>QR 코드 표시</span>
      <input type="checkbox" id="qsQrVis" checked>
    </label>
    <div class="qs-foot">
      <a href="admin.html" target="_blank" rel="noopener" class="qs-link">전체 관리자 페이지 열기 ↗</a>
    </div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="conn" id="conn" title="실시간 연결 상태"></div>

  <script src="vendor/qrcode.js"></script>
  <script src="js/shapes.js"></script>
  <script src="js/relay.js"></script>
  <script src="js/seed-data.js"></script>
  <script src="js/display.js"></script>
</body>
</html>
