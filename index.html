<!doctype html>
<html lang="ko" data-theme="lavender">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFE7FF">
<title>똑똑똑미술학원 — 방명록</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23FFD9E8'/%3E%3Ccircle cx='24' cy='28' r='5' fill='%23332A44'/%3E%3Ccircle cx='40' cy='28' r='5' fill='%23332A44'/%3E%3Cpath d='M22 40c4 6 16 6 20 0' stroke='%23332A44' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/display.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="orb orb-4"></span>
    <span class="grain"></span>
    <div class="ttok-floaters">
      <img src="ttok1.jpg" class="ttok-dot t1" alt="">
      <img src="ttok2.jpg" class="ttok-dot t2" alt="">
      <img src="ttok3.jpg" class="ttok-dot t3" alt="">
      <img src="ttok1.jpg" class="ttok-dot t4" alt="">
      <img src="ttok2.jpg" class="ttok-dot t5" alt="">
      <img src="ttok3.jpg" class="ttok-dot t6" alt="">
      <img src="ttok1.jpg" class="ttok-dot t7" alt="">
      <img src="ttok2.jpg" class="ttok-dot t8" alt="">
      <img src="ttok3.jpg" class="ttok-dot t9" alt="">
    </div>
  </div>

  <header class="topbar" id="topbar">
    <div class="brand-row">
      <img class="brand-logo" src="logo.png" alt="똑똑똑미술학원">
      <h1 class="title" id="title">방명록</h1>
    </div>
    <p class="subtitle" id="subtitle">What's on your mind? Fill your bubble!</p>
  </header>

  <main class="stage" id="stage" aria-live="polite"></main>

  <div class="spotlight" id="spotlight" aria-hidden="true"></div>

  <aside class="qr-panel" id="qrPanel">
    <div class="qr-card">
      <canvas id="qrCanvas" width="560" height="560" aria-label="모바일 그리기 페이지 QR 코드"></canvas>
      <span class="qr-glint" aria-hidden="true"></span>
    </div>
    <div class="qr-copy">
      <strong>휴대폰 카메라로 스캔</strong>
      <span>Scan &amp; draw your bubble</span>
      <em id="drawUrl">draw.html?room=…</em>
      <span class="qr-room">방 코드 <b id="roomCode">────────</b></span>
    </div>
  </aside>

  <div class="badge" id="countBadge"><span id="countNum">0</span> bubbles</div>
  <div class="hint" id="hint"><b>T</b> 테마 · <b>H</b> 화면 숨기기 · <b>Q</b> QR 숨기기</div>

  <!-- 터치 전용 버튼 (태블릿·스마트폰에서 단축키 대신 사용) -->
  <div class="touchbar" id="touchbar" role="toolbar" aria-label="화면 조작">
    <button class="tb" data-act="theme" title="테마 바꾸기" aria-label="테마 바꾸기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 2.2 2.2 0 0 0 2.2-2.2c0-.6-.2-1.1-.6-1.5-.4-.4-.6-.9-.6-1.4A2.4 2.4 0 0 1 15.4 13H17a4 4 0 0 0 4-4c0-3.3-4-6-9-6Z"/><circle cx="7.6" cy="10.2" r="1.15"/><circle cx="11" cy="7" r="1.15"/><circle cx="15.2" cy="8" r="1.15"/></svg>
    </button>
    <button class="tb" data-act="qr" title="QR 코드 켜기/끄기" aria-label="QR 코드 켜기/끄기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.4" y="3.4" width="7" height="7" rx="1.6"/><rect x="13.6" y="3.4" width="7" height="7" rx="1.6"/><rect x="3.4" y="13.6" width="7" height="7" rx="1.6"/><path d="M14 14h2.6v2.6H14zM18.4 14H21v1.4M14 18.4h1.4M17.6 18.4H21v2.6h-3.4z"/></svg>
    </button>
    <button class="tb" data-act="newroom" title="새 방 만들기" aria-label="새 방 만들기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tb" data-act="reset" title="방명록 비우기" aria-label="방명록 비우기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9.5 7V4.8h5V7M6.5 7l.9 12.2h9.2L17.5 7"/><path d="M10.4 10.6v5.4M13.6 10.6v5.4"/></svg>
    </button>
    <button class="tb" data-act="hide" title="화면 깔끔하게" aria-label="화면 깔끔하게">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.6 12S6 6.4 12 6.4 21.4 12 21.4 12 18 17.6 12 17.6 2.6 12 2.6 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>
    </button>
    <button class="tb fold" data-act="fold" title="버튼 접기" aria-label="버튼 접기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
  <button class="touch-show" id="touchShow" title="버튼 펼치기" aria-label="버튼 펼치기">⋯</button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="conn" id="conn" title="실시간 연결 상태"></div>

  <script src="vendor/qrcode.js"></script>
  <script src="js/shapes.js"></script>
  <script src="js/relay.js"></script>
  <script src="js/seed-data.js"></script>
  <script src="js/display.js"></script>
</body>
</html>
